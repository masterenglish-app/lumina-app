<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LUMINA CORE</title>
</head>
<body style="background:#111;color:#fff;text-align:center;padding-top:80px;">

<h2 id="word">Tap</h2>
<p id="mean"></p>

<button onclick="next()">Next</button>
<button onclick="save()">Save</button>

<p id="lumina"></p>

<div id="list">---</div>

<script>
const steps = [
  {w:"A", m:"a"},
  {w:"B", m:"b"},
  {w:"C", m:"c"}
];

let db = null;

// DB初期化
const request = indexedDB.open("LuminaDB", 2);

request.onupgradeneeded = function(e){
  const db = e.target.result;
  if(!db.objectStoreNames.contains("memory")){
    const store = db.createObjectStore("memory", {keyPath:"word"});
  }
};

request.onsuccess = function(e){
  db = e.target.result;
  load();
};

// Next
function next(){
  const s = steps[Math.floor(Math.random()*steps.length)];
  document.getElementById("word").innerText = s.w;
  document.getElementById("mean").innerText = s.m;
}

// Save（進化版）
function save(){
  if(!db){
    alert("DB準備中");
    return;
  }

  const word = document.getElementById("word").innerText;
  const mean = document.getElementById("mean").innerText;

  const tx = db.transaction("memory","readwrite");
  const store = tx.objectStore("memory");

  const req = store.get(word);

  req.onsuccess = function(){
    let data = req.result;

    if(data){
      // 🔥 既存 → 成長
      data.count += 1;
      data.lastSeen = Date.now();
    }else{
      // 新規
      data = {
        word: word,
        mean: mean,
        count: 1,
        lastSeen: Date.now()
      };
    }

    store.put(data);
  };

  tx.oncomplete = function(){
    document.getElementById("lumina").innerText = "記憶が深まりました";
    load();
  };
}

// 読み込み
function load(){
  if(!db) return;

  const tx = db.transaction("memory","readonly");
  const store = tx.objectStore("memory");

  const req = store.getAll();

  req.onsuccess = function(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    req.result.forEach(item=>{
      const div = document.createElement("div");
      div.innerText =
        item.word + " - " + item.mean + " (回数:" + item.count + ")";
      list.appendChild(div);
    });
  };
}
</script>

</body>
</html>
